# Contribution snake workflow — see DOCUMENTACAO.md#configuração-manual-necessária.
# Requires repository Actions permissions set to "Read and write permissions".
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=0F766E&color_dots=#E4EDF1,#B7DBE3,#71BAC8,#3295AA,#087F8C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=7AE2C3&color_dots=#172A3A,#214D62,#277E91,#39B6C4,#55DDE0
      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

