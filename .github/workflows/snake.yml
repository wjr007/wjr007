# Contribution snake workflow — see DOCUMENTACAO.md#configuração-manual-necessária.
# Requires repository Actions permissions set to "Read and write permissions".
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#050505&color_dots=#EAF2FF,#BFDBFE,#60A5FA,#2563EB,#0B1F3A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3B82F6&color_dots=#05070A,#071426,#0A2D52,#0B5CAB,#38BDF8
      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

